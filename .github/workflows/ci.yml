name: Verify release
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npx playwright test tests/e2e/ritual-catalog.spec.ts
        env:
          RITUAL_CATALOG_FIXTURE: '1'
      - name: Build against isolated catalog
        shell: bash
        run: |
          node tests/fixtures/woo-server.mjs &
          fixture_pid=$!
          trap 'kill "$fixture_pid"' EXIT
          npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3017
          WORDPRESS_SITE_URL: http://127.0.0.1:4010
          WORDPRESS_API_URL: http://127.0.0.1:4010/wp-json
          WOOCOMMERCE_STORE_API_URL: http://127.0.0.1:4010/wp-json/wc/store/v1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure
          path: test-results/
          retention-days: 7
