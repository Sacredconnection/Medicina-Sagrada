<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: topbar-01.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#680808}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1440px">
  <div class="r-left-truck region chrome" data-region="left-truck"><!-- Outlined delivery truck icon. --></div>
  <div class="r-left-copy region text" data-region="left-copy"><!-- Exact shipping deadline copy. --><p style="font-size:var(--r-left-copy-font);font-family:var(--r-left-copy-family),sans-serif;font-weight:var(--r-left-copy-weight);line-height:1.05;margin:0">left-copy</p></div>
  <div class="r-right-whatsapp region chrome" data-region="right-whatsapp"><!-- Outlined WhatsApp icon. --></div>
  <div class="r-right-copy region text" data-region="right-copy"><!-- Exact human support copy. --><p style="font-size:var(--r-right-copy-font);line-height:1.05;margin:0">right-copy</p></div>
</main>
</body>
</html>
